# USB impersonation profile selected when Pocket AirBridge starts.
profile=hp_kbd_vendor

# BLE name advertised by the AirBridge profile and used for browser discovery.
ble_name = HP 725 K+M
# Full public BLE MAC address; its OUI must be registered to HP/Hewlett-Packard.
ble_mac = 3C:52:82:00:00:01
# Bluetooth GAP appearance for the impersonated keyboard.
ble_appearance = 0x03C1
# Bluetooth SIG manufacturer company identifier used in scan-response data.
ble_mfg_company = 0x0065
# Optional manufacturer payload bytes as hexadecimal pairs; blank means no payload.
ble_mfg_hex =
# Device Information Service manufacturer name.
ble_dis_mfr = HP
# Device Information Service model number.
ble_dis_model = HP 725 K+M
# Device Information Service serial number.
ble_dis_serial = HP5341KBD01
# Device Information Service PnP version.
ble_dis_pnp = 0x0126
