function v2Reject(fn, message) {
  let rejected = false;
  try { fn(); } catch (error) { rejected = error instanceof Error; }
  assert(rejected, message);
}

function v2Meta(size = 0n, itemId = 1) {
  return v2.makeV2Meta({keyId:'AAAAAAAAAAAAAAAAAAAAAA',direction:'usb-to-ble',itemId,headerLen:50,payloadSize:size});
}

function testV2Wire() {
  equalBytes(v2.buildV2Frame(MSG.HELLO,0,1),new Uint8Array([1,0,0,0,8,0,0,0,1,65,66,50,83]),'v2 HELLO');
  const context={type:MSG.DATA,seq:0,itemId:1,segment:0};
  equalBytes(v2.makeV2AckPayload(context),new Uint8Array([3,0,0,65,66,50,83,0,0,0,1,0,0,0,0]),'v2 ACK');
  assert(v2.makeV2AckPayload(context,1).length===16,'NACK length');
  const wait=new v2.V2StopAndWait();
  wait.begin(v2.buildV2Frame(MSG.HELLO,0,1));
  v2Reject(()=>wait.receive(protocolBuildMessage(MSG.ACK,0,new Uint8Array([1,0,0]))),'legacy ACK accepted');
  v2Reject(()=>v2.parseV2Frame(protocolBuildMessage(MSG.HELLO,0,new Uint8Array(4))),'legacy HELLO accepted');
  for(const frame of [new Uint8Array(4),new Uint8Array(65),new Uint8Array([1,0,0,0,59])]) v2Reject(()=>v2.parseV2Frame(frame),'malformed frame accepted');
}

function testV2Header() {
  for(const value of ['01','-1','+1','1e4',1,'18446744073709551616']) v2Reject(()=>v2.parseCanonicalUint64(value),'noncanonical uint64');
  const header=v2.encodeV2Header({kind:'attachment',name:'é',mimeType:'x',payloadSize:0n,payloadSha256:'00'.repeat(32)});
  assert(header.length===53 && v2.decodeV2Header(header).name==='é','UTF-8 header');
  header[50]=255; v2Reject(()=>v2.decodeV2Header(header),'invalid UTF-8');
  for(const size of [0n,65486n,65487n,4194305n]) {
    const meta=v2Meta(size);
    const fragments=protocolEncodeMeta(meta);
    assert(fragments.length>1,'META collapsed');
    const parsed=v2.validateV2Meta(protocolDecodeMeta(fragments),{itemId:1,keyId:meta.keyId,direction:meta.direction});
    assert(parsed.totalCiphertextBytes===50n+size+16n*BigInt(meta.segmentCount),'segment totals');
  }
  v2Reject(()=>v2.v2StreamLayout(65537,0n),'oversized header');
  v2Reject(()=>v2.v2StreamLayout(50,65536n*0xffffffffn),'overflow segment count');
}

function testV2State() {
  const state=new v2.V2ReceiveState({keyId:'AAAAAAAAAAAAAAAAAAAAAA',direction:'usb-to-ble'});
  state.accept(v2.buildV2Frame(MSG.HELLO,0,1));
  for(const [seq,payload] of protocolEncodeMeta(v2Meta(65487n)).entries()) state.accept(v2.buildV2Frame(MSG.META,seq,1,undefined,payload));
  for(let seq=0;seq<1286;seq++) {
    const frame=v2.buildV2Frame(MSG.DATA,seq,1,0,new Uint8Array(seq===1285?17:51));
    assert(state.accept(frame).action==='ack','DATA not accepted');
    assert(state.accept(frame).action==='duplicate','duplicate appended');
  }
  assert(state.segmentIndex===1 && state.chunkInSegment===0 && state.ciphertextBytes===65552n,'rollover');
  state.accept(v2.buildV2Frame(MSG.CANCEL,0,1));
  state.accept(v2.buildV2Frame(MSG.HELLO,0,2));
  for(let repeat=0;repeat<3;repeat++) for(const type of [MSG.CANCEL,MSG.DONE,MSG.ERROR,MSG.BUSY,MSG.DATA]) {
    assert(state.accept(v2.buildV2Frame(type,0,1,type===MSG.DATA?0:undefined)).action==='stale','stale interruption');
  }
  assert(state.itemId===2,'stale control aborted new item');
  const first=v2.buildV2Frame(MSG.META,0,2,undefined,protocolEncodeMeta(v2Meta(0n,2))[0]);
  state.accept(first);first[first.length-1]^=1;
  v2Reject(()=>state.accept(first),'conflicting duplicate accepted');
  assert(state.itemId===null,'conflict did not abort');
}

function testV2Session() {
  const prefix=new Uint8Array([1,2,3,4]);
  equalBytes(v2.makeV2Iv(prefix,1,2),new Uint8Array([1,2,3,4,0,0,0,1,0,0,0,2]),'IV bytes');
  assert(String(v2.makeV2Iv(prefix,1,0))!==String(v2.makeV2Iv(prefix,0,1)),'shift collision');
  const ivs=new Set();
  for(const itemId of [1,2,3]) for(let segment=0;segment<1286;segment++) {
    const iv=String(v2.makeV2Iv(prefix,itemId,segment));
    assert(!ivs.has(iv),`duplicate IV for item ${itemId}, segment ${segment}`);
    ivs.add(iv);
  }
  assert(ivs.size===3*1286,'multi-item/segment IV uniqueness count');
  v2Reject(()=>v2.makeV2Iv(prefix,1,0x100000000),'segment overflow');
  assert(v2.compareV2Offers(1,1,1,2)<0,'USB equal-ID tie');
  const session=new AirBridgeCryptoSession({role:1,sendFn:async()=>{}});
  v2Reject(()=>session.allocateStreamItemId(),'pre-SAS allocation');
  const aad=v2.makeV2Aad({cryptoVersion:1,keyId:'AAAAAAAAAAAAAAAAAAAAAA',direction:'usb-to-ble',itemId:1,segmentIndex:0,segmentPlaintextLen:50,finalFlag:true});
  assert(aad.length===38 && aad[37]===1,'AAD length/final flag');
}

function testV2Completion() {
  for(const payloadSize of [0n,4194305n]) {
    const meta=v2Meta(payloadSize);
    const state=new v2.V2ReceiveState({keyId:meta.keyId,direction:meta.direction});
    state.accept(v2.buildV2Frame(MSG.HELLO,0,1));
    for(const [seq,payload] of protocolEncodeMeta(meta).entries()) state.accept(v2.buildV2Frame(MSG.META,seq,1,undefined,payload));
    for(let segment=0;segment<meta.segmentCount;segment++) {
      const length=segment===meta.segmentCount-1?v2.toSafeV2Number(BigInt(meta.totalCiphertextBytes)-BigInt(segment)*65552n):65552;
      for(let offset=0;offset<length;offset+=51) {
        state.accept(v2.buildV2Frame(MSG.DATA,offset/51,1,segment,new Uint8Array(Math.min(51,length-offset)).fill(segment&255)));
        assert(state.last.payload.length<=59 && state.metaFragments.length===0,'unbounded replay/ciphertext retention');
      }
    }
    const proof={authenticatedSegments:meta.segmentCount,streamPlaintextBytes:50n+payloadSize,
      headerLen:50,payloadSize,payloadBytes:payloadSize,payloadSha256:'00'.repeat(32),actualSha256:'00'.repeat(32)};
    v2Reject(()=>v2.verifyV2Completion(meta,{...proof,authenticatedSegments:0}),'unauthenticated completion');
    v2Reject(()=>v2.verifyV2Completion(meta,{...proof,payloadBytes:payloadSize+1n}),'wrong payload size');
    v2Reject(()=>v2.verifyV2Completion(meta,{...proof,actualSha256:'11'.repeat(32)}),'hash mismatch');
    state.verifyCompletion(proof);
    const done=v2.buildV2Frame(MSG.DONE,0,1);
    assert(state.accept(done).action==='ack','verified completion');
    assert(state.accept(done).action==='duplicate','DONE retry');
  }
}

function v2MalformedError(itemId) {
  const frame=v2.buildV2Frame(MSG.ERROR,0,itemId,undefined,'x');
  frame[frame.length-1]=255;
  return frame;
}

function testV2StaleMalformedError() {
  const state=new v2.V2ReceiveState({keyId:'AAAAAAAAAAAAAAAAAAAAAA',direction:'usb-to-ble'});
  state.accept(v2.buildV2Frame(MSG.HELLO,0,1));
  state.accept(v2.buildV2Frame(MSG.CANCEL,0,1));
  state.accept(v2.buildV2Frame(MSG.HELLO,0,2));
  const stale=v2MalformedError(1);
  v2Reject(()=>v2.parseV2Frame(stale),'standalone parser lost fatal UTF-8');
  const interrupt=()=>{
    const before={...state};
    for(let i=0;i<10;i++) assert(state.accept(stale).action==='stale','malformed stale ERROR accepted');
    assert(Object.keys(before).every(key=>state[key]===before[key]),'stale ERROR mutated receiver');
    assert(state.itemId===2,'new item was aborted');
  };
  interrupt();
  for(const [seq,payload] of protocolEncodeMeta(v2Meta(0n,2)).entries()) {
    state.accept(v2.buildV2Frame(MSG.META,seq,2,undefined,payload));interrupt();
  }
  state.accept(v2.buildV2Frame(MSG.DATA,0,2,0,new Uint8Array(51)));interrupt();
  state.accept(v2.buildV2Frame(MSG.DATA,1,2,0,new Uint8Array(15)));
  state.verifyCompletion({authenticatedSegments:1,streamPlaintextBytes:50n,headerLen:50,
    payloadSize:0n,payloadBytes:0n,payloadSha256:'00'.repeat(32),actualSha256:'00'.repeat(32)});
  interrupt();
  assert(state.accept(v2.buildV2Frame(MSG.DONE,0,2)).action==='ack','next item did not complete');
  state.accept(v2.buildV2Frame(MSG.HELLO,0,3));
  v2Reject(()=>state.accept(v2MalformedError(3)),'malformed current ERROR accepted');
  assert(state.itemId===null,'malformed current ERROR not fail-closed');
  const badMagic=stale.slice();badMagic[5]=0;
  const badSeq=stale.slice();badSeq[2]=1;
  const padded=new Uint8Array(64);padded.set(stale);padded[63]=1;
  for(const raw of [badMagic,badSeq,padded,stale.slice(0,12),new Uint8Array(65)]) v2Reject(()=>state.accept(raw),'ambiguous control ignored');
}

function testV2SenderStaleMalformedError() {
  const wait=new v2.V2StopAndWait();
  wait.begin(v2.buildV2Frame(MSG.HELLO,0,2));
  const pending=wait.pending;
  for(let i=0;i<10;i++) {
    assert(wait.receive(v2MalformedError(1))==='ignored','sender stale ERROR not ignored');
    assert(wait.pending===pending,'sender pending frame changed');
  }
  assert(wait.receive(protocolBuildMessage(MSG.ACK,0,v2.makeV2AckPayload({type:MSG.HELLO,seq:0,itemId:2,segment:0xffffffff})))==='ack','HELLO did not settle');
  wait.begin(v2.buildV2Frame(MSG.DATA,0,2,0,new Uint8Array(51)));
  assert(wait.receive(v2MalformedError(1))==='ignored','post-capability stale ERROR');
  v2Reject(()=>wait.receive(v2MalformedError(2)),'current invalid UTF-8 ignored');
  const badMagic=v2MalformedError(1);badMagic[5]=0;
  const other=new v2.V2StopAndWait();other.begin(v2.buildV2Frame(MSG.HELLO,0,2));
  v2Reject(()=>other.receive(badMagic),'ambiguous sender control ignored');
}

function testV2RetryViews() {
  const hello=v2.buildV2Frame(MSG.HELLO,0,1);
  const factories=[buffer=>new DataView(buffer,3,hello.length),buffer=>new Uint8Array(buffer,3,hello.length),
    buffer=>new Uint16Array(buffer,4,32),buffer=>new Float32Array(buffer,4,16)];
  for(const viewOf of factories) {
    const buffer=new ArrayBuffer(80);new Uint8Array(buffer).fill(0xa5);
    const view=viewOf(buffer);
    const raw=new Uint8Array(buffer,view.byteOffset,view.byteLength);raw.fill(0);raw.set(hello);
    const expected=raw.slice();
    const wait=new v2.V2StopAndWait();wait.begin(view);
    equalBytes(wait.pending.frame,expected,view.constructor.name+' retry bytes');
    new Uint8Array(buffer).fill(255);
    equalBytes(wait.pending.frame,expected,'retry aliases caller');
    assert(v2.parseV2Frame(wait.pending.frame).itemId===1,'retry context changed');
  }
}

const $ = id => document.getElementById(id);
const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

function assert(condition, message) {
  if (!condition) throw new Error(message);
}

function equalBytes(actual, expected, message) {
  assert(actual.length === expected.length, `${message}: length ${actual.length} !== ${expected.length}`);
  for (let i = 0; i < actual.length; i++) {
    assert(actual[i] === expected[i], `${message}: byte ${i} ${actual[i]} !== ${expected[i]}`);
  }
}

function localBuildMessage(type, seq, payload = new Uint8Array(0)) {
  const frame = new Uint8Array(HEADER_SIZE + payload.length);
  frame[0] = type;
  frame[1] = (seq >> 8) & 0xff;
  frame[2] = seq & 0xff;
  frame[3] = (payload.length >> 8) & 0xff;
  frame[4] = payload.length & 0xff;
  frame.set(payload, HEADER_SIZE);
  return frame;
}

function buildMessage(type, seq, payload = new Uint8Array(0)) {
  const built = protocolBuildMessage ? protocolBuildMessage(type, seq, payload) : localBuildMessage(type, seq, payload);
  return built instanceof Uint8Array ? built : new Uint8Array(built);
}

function localParseMessage(data) {
  const bytes = data instanceof Uint8Array ? data : new Uint8Array(data.buffer ?? data);
  assert(bytes.length >= HEADER_SIZE, 'frame is shorter than header');
  const len = (bytes[3] << 8) | bytes[4];
  assert(len <= MAX_PAYLOAD, `payload length ${len} exceeds ${MAX_PAYLOAD}`);
  assert(HEADER_SIZE + len <= bytes.length, 'payload length exceeds frame bytes');
  return {
    type: bytes[0],
    seq: (bytes[1] << 8) | bytes[2],
    len,
    payload: bytes.slice(HEADER_SIZE, HEADER_SIZE + len),
  };
}

function parseMessage(data) {
  const bytes = data instanceof Uint8Array ? data : new Uint8Array(data.buffer ?? data);
  const parsed = protocolParseMessage ? protocolParseMessage(bytes) : localParseMessage(bytes);
  if (!parsed) throw new Error('protocol parser returned no message');
  const payload = parsed.payload instanceof Uint8Array ? parsed.payload : new Uint8Array(parsed.payload ?? []);
  return {
    type: parsed.type,
    seq: parsed.seq,
    len: parsed.len ?? payload.length,
    payload,
  };
}

function toReport(message) {
  const bytes = message instanceof Uint8Array ? message : new Uint8Array(message);
  assert(bytes.length <= FRAME_SIZE, `message ${bytes.length} exceeds ${FRAME_SIZE}-byte report`);
  const report = new Uint8Array(FRAME_SIZE);
  report.set(bytes, 0);
  return report;
}

function ackPayload(type, seq) {
  return new Uint8Array([type, (seq >> 8) & 0xff, seq & 0xff]);
}

function nackPayload(type, seq, reason = NACK_REASON.MISSING) {
  return protocolMakeNackPayload(type, seq, reason);
}

function readAck(payload) {
  assert(payload.length === 3, 'ACK payload must be exactly three bytes');
  return { type: payload[0], seq: (payload[1] << 8) | payload[2] };
}

function readNack(messageOrPayload) {
  const message = messageOrPayload?.payload ? messageOrPayload : buildMessage(MSG.NACK, 0, messageOrPayload);
  const nack = protocolReadNackSeq(message);
  assert(nack, 'NACK payload must be exactly four bytes with a known reason');
  return nack;
}

function localEncodeMeta(meta) {
  const json = encoder.encode(JSON.stringify(meta));
  const fragmentSize = MAX_PAYLOAD - 2;
  const total = Math.ceil(json.length / fragmentSize);
  const frames = [];
  for (let seq = 0; seq < total; seq++) {
    const slice = json.slice(seq * fragmentSize, (seq + 1) * fragmentSize);
    const payload = new Uint8Array(2 + slice.length);
    payload[0] = (total >> 8) & 0xff;
    payload[1] = total & 0xff;
    payload.set(slice, 2);
    frames.push(buildMessage(MSG.META, seq, payload));
  }
  return frames;
}

function encodeMeta(meta) {
  const payloads = protocolEncodeMeta ? protocolEncodeMeta(meta) : null;
  if (Array.isArray(payloads)) return payloads.map((payload, seq) => buildMessage(MSG.META, seq, payload));
  return localEncodeMeta(meta);
}

function decodeMeta(frames) {
  const payloads = frames.map(frame => parseMessage(frame).payload);
  if (protocolDecodeMeta) {
    return protocolDecodeMeta(payloads);
  }

  const parsed = frames.map(parseMessage).sort((a, b) => a.seq - b.seq);
  const total = (parsed[0].payload[0] << 8) | parsed[0].payload[1];
  assert(parsed.length === total, `META fragment count ${parsed.length} !== ${total}`);
  const slices = [];
  for (let seq = 0; seq < total; seq++) {
    const msg = parsed[seq];
    assert(msg.seq === seq, `missing META fragment ${seq}`);
    assert(((msg.payload[0] << 8) | msg.payload[1]) === total, 'META total changed between fragments');
    slices.push(msg.payload.slice(2));
  }
  const byteLength = slices.reduce((sum, slice) => sum + slice.length, 0);
  const json = new Uint8Array(byteLength);
  let offset = 0;
  for (const slice of slices) {
    json.set(slice, offset);
    offset += slice.length;
  }
  return JSON.parse(decoder.decode(json));
}

async function sha256Hex(buffer) {
  if (protocolSha256) return (await protocolSha256(buffer)).replace(/^sha256:/, '');
  const digest = await crypto.subtle.digest('SHA-256', buffer);
  return Array.from(new Uint8Array(digest)).map(byte => byte.toString(16).padStart(2, '0')).join('');
}

function createMockTransport(name) {
  return {
    name,
    bleUuids: MOCK_BLE_UUIDS,
    peer: null,
    sentReports: [],
    onInputReport: null,
    connect(peer) { this.peer = peer; },
    async sendReport(reportIdOrData, maybeData) {
      const data = maybeData ?? reportIdOrData;
      const report = toReport(data);
      this.sentReports.push(report);
      await Promise.resolve();
      if (this.peer?.onInputReport) {
        await this.peer.onInputReport({
          reportId: REPORT_ID,
          data: new DataView(report.buffer),
          target: this.peer,
          source: this,
        });
      }
    },
  };
}

function linkTransports(left, right) {
  left.connect(right);
  right.connect(left);
}

function waitForAck(transport, type, seq) {
  return new Promise((resolve, reject) => {
    const timer = setTimeout(() => reject(new Error(`ACK timeout for ${seq}`)), 1000);
    const previous = transport.onInputReport;
    transport.onInputReport = event => {
      previous?.(event);
      const msg = parseMessage(new Uint8Array(event.data.buffer));
      const ack = msg.type === MSG.ACK ? readAck(msg.payload) : null;
      if (ack?.type === type && ack.seq === seq) {
        clearTimeout(timer);
        transport.onInputReport = previous;
        resolve(msg);
      }
    };
  });
}

async function sendWithAck(sender, type, seq, message) {
  const ack = waitForAck(sender, type, seq);
  await sender.sendReport(REPORT_ID, message);
  await ack;
}

async function simulateTextTransfer(direction) {
  const timing = createTimingRecorder({
    operation: 'chat-text',
    bundleBytes: 0,
    mock: true,
    hardware: false,
    details: { direction },
    sink: record => harnessEvidenceRecords.push(record),
  });
  const sender = createMockTransport(`${direction} sender`);
  const receiver = createMockTransport(`${direction} receiver`);
  linkTransports(sender, receiver);

  const data = encoder.encode(`hello from ${direction}`);
  timing.setBytes(data.length);
  const meta = {
    kind: 'text',
    itemId: direction === 'usb-to-ble' ? 1001 : 1002,
    direction,
    name: `${direction}.txt`,
    mimeType: 'text/plain',
    size: data.length,
    chunks: 1,
  };
  const received = { meta: null, chunks: new Map(), done: false };

  receiver.onInputReport = async event => {
    const msg = parseMessage(new Uint8Array(event.data.buffer));
    if (msg.type === MSG.HELLO) {
      await receiver.sendReport(REPORT_ID, buildMessage(MSG.ACK, 0, ackPayload(MSG.HELLO, 0)));
      return;
    }
    if (msg.type === MSG.META) {
      received.metaFrames ??= [];
      received.metaFrames[msg.seq] = toReport(buildMessage(MSG.META, msg.seq, msg.payload));
      await receiver.sendReport(REPORT_ID, buildMessage(MSG.ACK, 0, ackPayload(MSG.META, msg.seq)));
      const total = (msg.payload[0] << 8) | msg.payload[1];
      if (received.metaFrames.filter(Boolean).length === total) received.meta = decodeMeta(received.metaFrames);
      return;
    }
    if (msg.type === MSG.DATA) {
      received.chunks.set(msg.seq, msg.payload);
      await receiver.sendReport(REPORT_ID, buildMessage(MSG.ACK, 0, ackPayload(MSG.DATA, msg.seq)));
      return;
    }
    if (msg.type === MSG.DONE) {
      received.done = true;
      await receiver.sendReport(REPORT_ID, buildMessage(MSG.ACK, 0, ackPayload(MSG.DONE, msg.seq)));
    }
  };

  timing.markFirstReport();
  await sendWithAck(sender, MSG.HELLO, 0, buildMessage(MSG.HELLO, 0, new Uint8Array([
    (meta.itemId >>> 24) & 0xff,
    (meta.itemId >>> 16) & 0xff,
    (meta.itemId >>> 8) & 0xff,
    meta.itemId & 0xff,
  ])));
  for (const frame of encodeMeta(meta)) {
    const msg = parseMessage(frame);
    await sendWithAck(sender, MSG.META, msg.seq, frame);
  }
  await sendWithAck(sender, MSG.DATA, 0, buildMessage(MSG.DATA, 0, data));
  await sendWithAck(sender, MSG.DONE, 0, buildMessage(MSG.DONE, 0));

  assert(received.done, `${direction} transfer did not complete`);
  assert(JSON.stringify(received.meta) === JSON.stringify(meta), `${direction} metadata mismatch`);
  equalBytes(received.chunks.get(0), data, `${direction} text payload`);
  assert(sender.sentReports.every(report => report.length === FRAME_SIZE), `${direction} sender did not use 64-byte reports`);
  assert(receiver.sentReports.every(report => report.length === FRAME_SIZE), `${direction} receiver did not use 64-byte reports`);
  const record = timing.complete({ bundleBytes: data.length, transferBytes: data.length });
  assert(record.operation === 'chat-text' && record.details.direction === direction, `${direction} chat timing did not record direction`);
  assert(record.bundleBytes === data.length && Number.isFinite(record.completeTimeMs), `${direction} chat timing missing bytes or completion`);
}

async function testBusyCollision() {
  const low = createMockTransport('low itemId sender');
  const high = createMockTransport('high itemId sender');
  const bridge = { activeItemId: null };
  const events = [];

  function handleInitiate(transport, itemId) {
    setTimeout(async () => {
      if (bridge.activeItemId === null || itemId < bridge.activeItemId) {
        const displaced = bridge.activeTransport;
        bridge.activeItemId = itemId;
        bridge.activeTransport = transport;
        events.push(`${transport.name}:WIN`);
        if (displaced) {
          const payload = encoder.encode(JSON.stringify({ winnerItemId: itemId, loserItemId: itemId === 10 ? 11 : 10 }));
          await displaced.onInputReport?.({ data: new DataView(toReport(buildMessage(MSG.BUSY, 0, payload)).buffer), target: displaced });
        }
        return;
      }

      const payload = encoder.encode(JSON.stringify({ winnerItemId: bridge.activeItemId, loserItemId: itemId }));
      events.push(`${transport.name}:BUSY`);
      await transport.onInputReport?.({ data: new DataView(toReport(buildMessage(MSG.BUSY, 0, payload)).buffer), target: transport });
    }, 0);
  }

  let highBusy = null;
  high.onInputReport = event => {
    const msg = parseMessage(new Uint8Array(event.data.buffer));
    if (msg.type === MSG.BUSY) highBusy = JSON.parse(decoder.decode(msg.payload));
  };
  low.onInputReport = event => {
    const msg = parseMessage(new Uint8Array(event.data.buffer));
    if (msg.type === MSG.BUSY) throw new Error('lower itemId received BUSY');
  };

  handleInitiate(low, 10);
  handleInitiate(high, 11);
  await sleep(20);

  assert(bridge.activeItemId === 10, 'lower itemId did not win collision');
  assert(highBusy?.winnerItemId === 10 && highBusy?.loserItemId === 11, 'BUSY payload did not resolve toward lower itemId');
  assert(events.includes('low itemId sender:WIN'), 'winner was not recorded');
}

async function testSimultaneousHelloArbitration() {
  const completions = [];
  const yields = [];
  const starts = [];

  function helloItemId(message) {
    const payload = message.payload;
    return (((payload[0] << 24) >>> 0) | (payload[1] << 16) | (payload[2] << 8) | payload[3]) >>> 0;
  }

  function withAbort(promise, signal) {
    const wrapped = Promise.resolve(promise);
    if (signal.aborted) return Promise.reject(signal.reason);
    return new Promise((resolve, reject) => {
      const onAbort = () => reject(signal.reason);
      signal.addEventListener('abort', onAbort, { once: true });
      wrapped.then(
        value => {
          signal.removeEventListener('abort', onAbort);
          resolve(value);
        },
        error => {
          signal.removeEventListener('abort', onAbort);
          reject(error);
        },
      );
    });
  }

  function abortError(message) {
    const error = new Error(message);
    error.name = 'AbortError';
    return error;
  }

  function* abortableData(chunks, signal) {
    for (const chunk of chunks) {
      if (signal.aborted) throw signal.reason;
      yield chunk;
    }
  }

  async function createEndpoint(name, itemId) {
    const data = encoder.encode(`${name} simultaneous message`);
    const hash = await sha256Hex(data);
    const item = {
      meta: {
        kind: 'text',
        itemId,
        name: `${name}.txt`,
        mimeType: 'text/plain',
        size: data.length,
        chunks: 1,
        hash: `sha256:${hash}`,
      },
      chunks: [data],
    };
    const endpoint = {
      name,
      item,
      active: null,
      yielded: null,
      retryPromise: null,
      failure: null,
      peer: null,
    };

    endpoint.transport = {
      async send(frame) {
        const copy = new Uint8Array(frame);
        await sleep(0);
        await endpoint.peer.receive(copy);
      },
    };
    endpoint.sender = new ItemSender(frame => {
      const message = parseMessage(frame);
      if (endpoint.active && message) endpoint.active.pendingAck = { type: message.type, seq: message.seq };
      return endpoint.transport.send(frame);
    }, { timeoutMs: 100, retries: 1 });
    endpoint.receiver = new ItemReceiver({ sendFn: frame => endpoint.transport.send(frame) });
    endpoint.receiver.on('item', ({ meta }) => {
      completions.push(meta.itemId);
      if (!endpoint.yielded) return;
      const yielded = endpoint.yielded;
      endpoint.yielded = null;
      endpoint.retryPromise = (async () => {
        await sleep(0);
        await endpoint.start(yielded);
      })().catch(error => { endpoint.failure = error; throw error; });
    });
    endpoint.receive = async frame => {
      const message = parseMessage(frame);
      if (message.type === MSG.ACK) {
        endpoint.sender.receiveAck(message);
        return;
      }
      if (message.type === MSG.HELLO && endpoint.active && !endpoint.active.yielded) {
        const peerItemId = helloItemId(message);
        if (peerItemId < endpoint.active.item.meta.itemId) {
          const transfer = endpoint.active;
          transfer.yielded = true;
          endpoint.yielded = transfer.item;
          yields.push(name);
          transfer.controller.abort(abortError(`Yielded to peer item ${peerItemId}`));
          if (transfer.pendingAck) {
            endpoint.sender.receiveAck(buildMessage(MSG.ACK, 0, ackPayload(transfer.pendingAck.type, transfer.pendingAck.seq)));
            transfer.pendingAck = null;
          }
          endpoint.receiver.setBusy(false);
          await endpoint.receiver.onMessage(message);
          return;
        }
        await endpoint.transport.send(buildMessage(MSG.BUSY, 0, encoder.encode(JSON.stringify({
          winnerItemId: endpoint.active.item.meta.itemId,
          loserItemId: peerItemId,
          retryAfterMs: 1,
        }))));
        return;
      }
      await endpoint.receiver.onMessage(message);
    };
    endpoint.start = async outbound => {
      const transfer = { item: outbound, controller: new AbortController(), pendingAck: null, yielded: false };
      endpoint.active = transfer;
      endpoint.receiver.setBusy(true);
      starts.push(`${name}:${outbound.meta.itemId}`);
      const { signal } = transfer.controller;
      try {
        await withAbort(endpoint.sender.sendHello(outbound.meta.itemId), signal);
        const metaPayloads = protocolEncodeMeta
          ? protocolEncodeMeta(outbound.meta)
          : localEncodeMeta(outbound.meta).map(frame => parseMessage(frame).payload);
        for (const [seq, payload] of metaPayloads.entries()) {
          await withAbort(endpoint.sender.sendWithAck(buildMessage(MSG.META, seq, payload), seq), signal);
        }
        await withAbort(endpoint.sender.sendItemData(abortableData(outbound.chunks, signal)), signal);
        await withAbort(endpoint.sender.sendItemDone(), signal);
      } catch (error) {
        if (!transfer.yielded) throw error;
      } finally {
        if (endpoint.active === transfer) endpoint.active = null;
        endpoint.receiver.setBusy(false);
      }
    };
    return endpoint;
  }

  const low = await createEndpoint('low', 100);
  const high = await createEndpoint('high', 200);
  low.peer = high;
  high.peer = low;

  await Promise.all([low.start(low.item), high.start(high.item)]);
  for (let attempt = 0; attempt < 100 && completions.length < 2; attempt++) await sleep(10);
  await high.retryPromise;

  assert(completions.length === 2, `expected two completed items, got ${completions.length}`);
  assert(completions[0] === 100, `lower item did not complete first: ${completions.join(', ')}`);
  assert(completions[1] === 200, `yielded item did not complete after retry: ${completions.join(', ')}`);
  assert(yields.length === 1 && yields[0] === 'high', `expected exactly high to yield, got ${yields.join(', ') || 'none'}`);
  assert(starts.filter(start => start === 'high:200').length === 2, `high item was not retried exactly once: ${starts.join(', ')}`);
  assert(!low.failure && !high.failure, 'an arbitrated send failed');
}

function concatTestChunks(chunks) {
  const total = chunks.reduce((sum, chunk) => sum + chunk.length, 0);
  const out = new Uint8Array(total);
  let offset = 0;
  for (const chunk of chunks) {
    out.set(chunk, offset);
    offset += chunk.length;
  }
  return out;
}

function bytesContain(haystack, needle) {
  if (needle.length === 0) return true;
  for (let offset = 0; offset <= haystack.length - needle.length; offset++) {
    let found = true;
    for (let index = 0; index < needle.length; index++) {
      if (haystack[offset + index] !== needle[index]) {
        found = false;
        break;
      }
    }
    if (found) return true;
  }
  return false;
}

function createCryptoEndpoint(role) {
  const endpoint = { peer: null, sent: [], errors: [], states: [], received: [] };
  endpoint.itemSender = new ItemSender(frame => endpoint.send(frame), { timeoutMs: 300, retries: 2 });
  endpoint.itemReceiver = new ItemReceiver({ sendFn: frame => endpoint.send(frame), nackDelayMs: 25 });
  endpoint.session = new AirBridgeCryptoSession({
    role,
    sendFn: frame => endpoint.send(frame),
    timeoutMs: 300,
    retries: 2,
    onStateChange: status => endpoint.states.push(status),
  });
  endpoint.itemReceiver.setItemValidator(({ meta, data }) => endpoint.session.decryptItem(meta, data));
  endpoint.send = async frame => {
    const copy = new Uint8Array(frame);
    endpoint.sent.push(parseMessage(copy));
    await Promise.resolve();
    await endpoint.peer.receive(copy);
  };
  endpoint.receive = async frame => {
    const msg = parseMessage(frame);
    try {
      if (msg.type === MSG.ACK) {
        if (!endpoint.itemSender.receiveAck(msg)) endpoint.session.receiveAck(msg);
        return;
      }
      if (msg.type === MSG.NACK) {
        if (!endpoint.itemSender.receiveNack(msg)) endpoint.session.receiveNack(msg);
        return;
      }
      if (endpoint.session.isCryptoFrame(msg)) {
        await endpoint.session.onMessage(msg);
        return;
      }
      if (msg.type === MSG.ERROR) {
        endpoint.errors.push(decoder.decode(msg.payload));
        endpoint.itemSender.receiveError(msg);
        endpoint.session.clearKeys(CRYPTO_STATE.ABORTED);
        return;
      }
      if (msg.type === MSG.HELLO || msg.type === MSG.META || msg.type === MSG.DATA || msg.type === MSG.DONE) {
        if (!endpoint.session.isUnlocked()) {
          await endpoint.send(buildMessage(MSG.ERROR, 0, encoder.encode('crypto locked')));
          endpoint.session.clearKeys(CRYPTO_STATE.ABORTED);
          endpoint.errors.push('crypto locked');
          return;
        }
      }
      await endpoint.itemReceiver.onMessage(msg);
    } catch (error) {
      endpoint.errors.push(error.message || String(error));
    }
  };
  endpoint.itemReceiver.on('item', detail => endpoint.received.push(detail));
  endpoint.itemReceiver.on('error', error => endpoint.errors.push(error.message || String(error)));
  return endpoint;
}

async function createUnlockedCryptoPair() {
  requireCrypto();
  const usb = createCryptoEndpoint(CRYPTO_ROLE.USB);
  const ble = createCryptoEndpoint(CRYPTO_ROLE.BLE);
  usb.peer = ble;
  ble.peer = usb;
  await ble.session.start();
  await usb.session.start();
  assert(usb.session.getStatus().state === CRYPTO_STATE.SAS_PENDING, 'USB did not enter SAS pending');
  assert(ble.session.getStatus().state === CRYPTO_STATE.SAS_PENDING, 'BLE did not enter SAS pending');
  return { usb, ble };
}

async function unlockCryptoPair() {
  const pair = await createUnlockedCryptoPair();
  assert(pair.usb.session.getStatus().sas === pair.ble.session.getStatus().sas, 'SAS codes do not match');
  await pair.usb.session.acceptSas();
  assert(!pair.usb.session.isUnlocked(), 'USB unlocked before peer KEY_CONFIRM');
  await pair.ble.session.acceptSas();
  assert(pair.usb.session.isUnlocked(), 'USB did not unlock after mutual SAS confirm');
  assert(pair.ble.session.isUnlocked(), 'BLE did not unlock after mutual SAS confirm');
  return pair;
}

function chunkBytes(bytes) {
  const chunks = [];
  for (let offset = 0; offset < bytes.length; offset += MAX_PAYLOAD) chunks.push(bytes.slice(offset, offset + MAX_PAYLOAD));
  return chunks.length ? chunks : [new Uint8Array(0)];
}

async function sendEncryptedHarnessItem(from, to, plainMeta, plainBytes) {
  const encrypted = await from.session.encryptItem(plainMeta, plainBytes);
  const chunks = chunkBytes(encrypted.data);
  await from.itemSender.sendHello(plainMeta.itemId);
  await from.itemSender.sendItemMeta(encrypted.meta);
  await from.itemSender.sendItemData(chunks);
  await from.itemSender.sendItemDone();
  for (let attempt = 0; attempt < 30 && to.received.length === 0; attempt++) await sleep(10);
  assert(to.received.length === 1, 'encrypted item was not received');
  return encrypted;
}

async function testNackRecoversDroppedChunk() {
  const receiverMessages = [];
  const senderMessages = [];
  const receivedItems = [];
  let sender;
  let dropped = false;
  const receiver = new ItemReceiver({
    nackDelayMs: 15,
    sendFn: async frame => {
      const msg = parseMessage(frame);
      receiverMessages.push(msg);
      if (msg.type === MSG.ACK) sender.receiveAck(msg);
      if (msg.type === MSG.NACK) sender.receiveNack(msg);
    },
  });
  sender = new ItemSender(async frame => {
    const msg = parseMessage(frame);
    senderMessages.push(msg);
    if (msg.type === MSG.DATA && msg.seq === 1 && !dropped) {
      dropped = true;
      await receiver.onMessage(buildMessage(MSG.DATA, 2, encoder.encode('gap-observed')));
      return;
    }
    await receiver.onMessage(frame);
  }, { timeoutMs: 80, retries: 3 });
  receiver.on('item', item => receivedItems.push(item));

  const data = encoder.encode('first chunk'.padEnd(MAX_PAYLOAD, '.') + 'second chunk after one drop');
  const chunks = chunkBytes(data);
  const hash = await sha256Hex(data);
  const meta = { kind: 'text', itemId: 8101, name: 'nack-recovery.txt', mimeType: 'text/plain', size: data.length, chunks: chunks.length, hash: `sha256:${hash}` };

  await sender.sendHello(meta.itemId);
  await sender.sendItemMeta(meta);
  await sender.sendItemData(chunks);
  await sender.sendItemDone();

  const nack = receiverMessages.find(message => message.type === MSG.NACK);
  assert(nack, 'receiver did not send NACK for the dropped chunk');
  const nacked = readNack(nack.payload);
  assert(nacked.type === MSG.DATA && nacked.seq === 1 && nacked.reason === NACK_REASON.MISSING, 'NACK did not reference the missing DATA seq 1');
  assert(senderMessages.filter(message => message.type === MSG.DATA && message.seq === 1).length === 2, 'sender did not retransmit exactly the NACKed frame once');
  assert(senderMessages.filter(message => message.type === MSG.DATA && message.seq === 0).length === 1, 'sender retransmitted an unrelated DATA frame');
  assert(sender.sentFrames.size === 0, 'sender retained frames after ITEM_DONE ACK');
  assert(receivedItems.length === 1, 'recovered transfer did not complete exactly once');
  equalBytes(receivedItems[0].data, data, 'recovered plaintext data');
}

async function testNackRepeatedDropsExhaustRetries() {
  const receiverMessages = [];
  const senderMessages = [];
  let sender;
  const receiver = new ItemReceiver({
    nackDelayMs: 10,
    sendFn: async frame => {
      const msg = parseMessage(frame);
      receiverMessages.push(msg);
      if (msg.type === MSG.ACK) sender.receiveAck(msg);
      if (msg.type === MSG.NACK) sender.receiveNack(msg);
    },
  });
  sender = new ItemSender(async frame => {
    const msg = parseMessage(frame);
    senderMessages.push(msg);
    if (msg.type === MSG.DATA && msg.seq === 0) {
      await receiver.onMessage(buildMessage(MSG.DATA, 1, encoder.encode('gap-observed')));
      return;
    }
    await receiver.onMessage(frame);
  }, { timeoutMs: 30, retries: 2 });

  const data = encoder.encode('dropped forever');
  const hash = await sha256Hex(data);
  const meta = { kind: 'text', itemId: 8102, name: 'nack-exhaustion.txt', mimeType: 'text/plain', size: data.length, chunks: 1, hash: `sha256:${hash}` };

  await sender.sendHello(meta.itemId);
  await sender.sendItemMeta(meta);
  let failure = null;
  try {
    await sender.sendItemData([data]);
  } catch (error) {
    failure = error;
  }

  assert(failure?.name === 'RetryExhaustedError', 'repeated dropped DATA did not exhaust retry budget');
  assert(receiverMessages.some(message => message.type === MSG.NACK && readNack(message.payload).seq === 0), 'receiver did not NACK the missing DATA seq 0');
  assert(senderMessages.filter(message => message.type === MSG.DATA && message.seq === 0).length === 3, 'sender did not honor the configured retry budget');
  assert(senderMessages.some(message => message.type === MSG.ERROR), 'sender did not surface retry exhaustion as ERROR');
}

  const { usb, ble } = await unlockCryptoPair();

function createBootstrapStreamReports(bytes, checksum) {
  const header = new Uint8Array(FRAME_SIZE);
  const view = new DataView(header.buffer);
  view.setUint32(0, bytes.length, true);
  view.setUint32(4, checksum, true);
  const reports = [header];
  for (let offset = 0; offset < bytes.length; offset += FRAME_SIZE) {
    const report = new Uint8Array(FRAME_SIZE);
    report.set(bytes.slice(offset, offset + FRAME_SIZE));
    reports.push(report);
  }
  return reports;
}

async function gzipBytes(bytes) {
  assert('CompressionStream' in globalThis, 'CompressionStream unavailable for gzip fixture');
  const compressed = new Blob([bytes]).stream().pipeThrough(new CompressionStream('gzip'));
  return new Uint8Array(await new Response(compressed).arrayBuffer());
}

function createBootstrapMockHid(reports) {
  const listeners = new Set();
  return {
    collections: [{ usagePage: 0xFF00, usage: 0x01 }],
    sentReports: [],
    addEventListener(type, listener) { if (type === 'inputreport') listeners.add(listener); },
    removeEventListener(type, listener) { if (type === 'inputreport') listeners.delete(listener); },
    async sendReport(reportId, data) {
      this.sentReports.push({ reportId, data: new Uint8Array(data) });
      for (const report of reports) {
        for (const listener of listeners) listener({ data: new DataView(report.buffer) });
      }
    },
  };
}

async function runBootstrapStreamClient(device, bootDocument, options = {}) {
  const setStatus = options.setStatus ?? (() => {});
  const timeoutMs = options.timeoutMs ?? 8000;
  const timing = createTimingRecorder({
    operation: 'deploy-stream',
    bundleBytes: 0,
    mock: true,
    hardware: false,
    sink: record => harnessEvidenceRecords.push(record),
  });
  let total;
  let expectedChecksum;
  let received = 0;
  let checksum = 0;
  const bytes = [];
  let resolve;
  let timer;
  let settled = false;
  const Decompressor = Object.hasOwn(options, 'decompressionStream') ? options.decompressionStream : globalThis.DecompressionStream;
  const done = new Promise(value => { resolve = value; });
  const finish = async () => {
    if (settled) return;
    settled = true;
    clearTimeout(timer);
    device.removeEventListener('inputreport', onReport);
    if (checksum !== expectedChecksum) {
      setStatus('Transfer corrupt — retry');
      timing.fail('checksum mismatch', { bundleBytes: total ?? received, transferBytes: received });
      resolve(false);
      return;
    }
    if (!Decompressor) {
      setStatus('Transfer unsupported - retry');
      timing.fail('gzip unsupported', { bundleBytes: total ?? received, transferBytes: received });
      resolve(false);
      return;
    }
    let html;
    try {
      html = await new Response(new Blob([new Uint8Array(bytes)]).stream().pipeThrough(new Decompressor('gzip'))).text();
    } catch (error) {
      setStatus('Transfer corrupt — retry');
      timing.fail('gzip decode failed', { bundleBytes: total ?? received, transferBytes: received });
      resolve(false);
      return;
    }
    bootDocument.open();
    bootDocument.write(html);
    bootDocument.close();
    timing.complete({ bundleBytes: total ?? received, transferBytes: received });
    resolve(true);
  };
  const onReport = event => {
    const report = new Uint8Array(event.data.buffer, event.data.byteOffset, event.data.byteLength);
    timing.markFirstReport();
    if (total === undefined) {
      const header = new DataView(report.buffer, report.byteOffset, report.byteLength);
      total = header.getUint32(0, true);
      expectedChecksum = header.getUint32(4, true);
      timing.setBytes(total);
      if (total === 0) void finish();
      return;
    }
    const count = Math.min(report.length, total - received);
    for (let index = 0; index < count; index++) {
      const byte = report[index];
      bytes.push(byte);
      checksum = (checksum + byte) >>> 0;
    }
    received += count;
    if (received === total) void finish();
  };
  device.addEventListener('inputreport', onReport);
  timer = setTimeout(() => {
    if (settled) return;
    settled = true;
    device.removeEventListener('inputreport', onReport);
    setStatus('Transfer timed out - retry');
    timing.fail('timeout', { bundleBytes: total ?? received, transferBytes: received });
    resolve(false);
  }, timeoutMs);
  const request = new Uint8Array(FRAME_SIZE);
  request[0] = 0x42;
  await device.sendReport(0, request);
  return done;
}

function classifyDeployRequest(screen, report) {
  const isBundleRequest = report.length > 0 && report[0] === 0x42;
  if (!isBundleRequest) return 'relay';
  switch (screen) {
    case 'Waiting': return 'stream';
    case 'Bridge': return 'relay';
    case 'DeployPrompt':
    case 'Typing':
    case 'Streaming':
    case 'Done':
    case 'Error':
      return 'fail-visible';
    default:
      throw new Error(`unknown AirbridgeScreen ${screen}`);
  }
}

async function testBootstrapStreamReassembly() {
  const bundle = encoder.encode('<!doctype html><title>Mock bundle</title><p>loaded</p>');
  const compressedBundle = await gzipBytes(bundle);
  const checksum = compressedBundle.reduce((sum, byte) => (sum + byte) >>> 0, 0);
  const bootDocument = {
    calls: [],
    text: '',
    open() { this.calls.push('open'); },
    write(text) { this.calls.push('write'); this.text = text; },
    close() { this.calls.push('close'); },
  };
  const device = createBootstrapMockHid(createBootstrapStreamReports(compressedBundle, checksum));
  let status = 'Ready';
  const booted = await runBootstrapStreamClient(device, bootDocument, { setStatus: text => { status = text; } });

  assert(booted, 'correct bootstrap stream did not boot');
  assert(bootDocument.text === decoder.decode(bundle), 'bundle text was not reassembled');
  assert(bootDocument.calls.join(',') === 'open,write,close', 'bundle did not boot through document.open/write/close');
  assert(device.sentReports.length === 1 && device.sentReports[0].reportId === 0 && device.sentReports[0].data.length === 64 && device.sentReports[0].data[0] === 0x42, 'bundle request was not one 64-byte 0x42 report');
  assert(status === 'Ready', 'valid bootstrap stream changed retry status');
  const validTiming = harnessEvidenceRecords.at(-1);
  assert(validTiming?.operation === 'deploy-stream', 'deploy stream timing was not recorded');
  assert(validTiming.bundleBytes === compressedBundle.length, 'deploy stream timing did not record compressed bundle bytes');
  assert(Number.isFinite(validTiming.firstReportTimestampMs), 'deploy stream timing did not record first report timestamp');
  assert(Number.isFinite(validTiming.firstReportLatencyMs), 'deploy stream timing did not record first report latency');
  assert(Number.isFinite(validTiming.completeTimeMs), 'deploy stream timing did not record completion time');
  assert(Number.isFinite(validTiming.transferKbps), 'deploy stream timing did not record transfer KB/s');
  assert(validTiming.errorState === null, 'valid deploy stream recorded an error');
  assert(validTiming.mock === true && validTiming.hardware === false, 'deploy stream timing did not mark mock run');

  const corrupt = compressedBundle.slice();
  corrupt[0] ^= 0xff;
  const corruptDevice = createBootstrapMockHid(createBootstrapStreamReports(corrupt, checksum));
  const corruptDocument = { open() {}, write() {}, close() {} };
  const corruptBooted = await runBootstrapStreamClient(corruptDevice, corruptDocument, { setStatus: text => { status = text; } });
  assert(!corruptBooted, 'corrupt bootstrap stream booted');
  assert(status === 'Transfer corrupt — retry', 'corrupt bootstrap stream did not show retry state');
  const corruptTiming = harnessEvidenceRecords.at(-1);
  assert(corruptTiming?.errorState === 'checksum mismatch', 'corrupt deploy stream timing did not record checksum error');
  const counterRecord = recordFlipperCounters({ usbToBle: 1, bleToUsb: 2, drop: 0, txerr: 0 }, { mock: true, hardware: false, sink: entry => harnessEvidenceRecords.push(entry) });
  assert(counterRecord.flipperCounters.drop === 0 && counterRecord.flipperCounters.txerr === 0, 'Flipper counter evidence did not preserve zero DROP/TXERR');
}

async function testBootstrapCompressedStreamUnsupported() {
  const raw = encoder.encode('<!doctype html><title>Unsupported gzip</title>');
  const compressed = await gzipBytes(raw);
  const checksum = compressed.reduce((sum, byte) => (sum + byte) >>> 0, 0);
  const bootDocument = { open() { throw new Error('unsupported browser should not boot'); }, write() {}, close() {} };
  let status = 'Ready';

  const ok = await runBootstrapStreamClient(
    createBootstrapMockHid(createBootstrapStreamReports(compressed, checksum)),
    bootDocument,
    { setStatus: text => { status = text; }, decompressionStream: undefined },
  );

  assert(!ok, 'unsupported DecompressionStream path booted');
  assert(status === 'Transfer unsupported - retry', 'unsupported DecompressionStream path did not fail clearly');
}

// ─── bootstrap.js eval test ─────────────────────────────────────────────────

function createHidDeviceMock(reports) {
  const listeners = new Set();

  const device = {
    vendorId: 0x03F0,
    productId: 0x5341,
    collections: [{ usagePage: 0xFF00, usage: 0x01 }],
    sentReports: [],
    closeCallOrder: [],
    async open() {},
    addEventListener(type, listener) {
      if (type === 'inputreport') listeners.add(listener);
    },
    removeEventListener(type, listener) {
      if (type === 'inputreport') listeners.delete(listener);
    },
    async sendReport(reportId, data) {
      const reportData = new Uint8Array(data);
      this.sentReports.push({ reportId, data: reportData });
      // Deliver each stored HID report synchronously so finish() (doc.open) runs
      // inside sendReport — and therefore BEFORE await sendReport in the handler
      // lets close() run after removeEventListener.
      for (const report of reports) {
        const u8 = new Uint8Array(report);
        if (this.oninputreport) this.oninputreport({ data: new DataView(u8.buffer, u8.byteOffset, u8.byteLength) });
        for (const listener of listeners) {
          listener({ data: new DataView(u8.buffer, u8.byteOffset, u8.byteLength) });
        }
      }
    },
    async close() {
      this.closeCallOrder.push('close');
    },
  };
  return device;
}

async function testBootstrapJsEval() {
  // 1. Fetch the real bootstrap.js source (not a copy-paste).
  const res = await fetch(`./bootstrap.js?cache=${Date.now()}`);
  assert(res.ok, 'could not fetch bootstrap.js');
  const source = await res.text();
  assert(source.includes('navigator.hid'), 'fetched source does not reference navigator.hid');

  // 2. Parse it — any SyntaxError here would have been the hardware bug.
  assert(() => { try { new Function(source); return true; } catch { return false; } },
    'bootstrap.js has a syntax error and would not parse in a browser');

  // 3. Build an iframe context with mocked navigator.hid + URL.
  const iframe = document.createElement('iframe');
  iframe.srcdoc = '<!DOCTYPE html><html><head></head><body></body></html>';
  document.body.appendChild(iframe);
  await sleep(50); // allow srcdoc to load

  const win = iframe.contentWindow;
  const doc = win.document;

  // Tiny test payload: '<b>ok</b>' (7 bytes).
  const payloadBytes = encoder.encode('<b>ok</b>');
  const compressedPayload = await gzipBytes(payloadBytes);
  const totalLen = compressedPayload.length;
  const checksum = compressedPayload.reduce((s, b) => (s + b) >>> 0, 0);

  // Build 64-byte HID reports: report 0 = header (LE total, LE checksum),
  // subsequent reports = payload bytes (up to 64 bytes each, no framing).
  const headerReport = new Uint8Array(FRAME_SIZE);
  new DataView(headerReport.buffer).setUint32(0, totalLen, true);
  new DataView(headerReport.buffer).setUint32(4, checksum, true);
  const payloadReport = new Uint8Array(FRAME_SIZE);
  payloadReport.set(compressedPayload, 0);
  const mockDevice = createHidDeviceMock([headerReport, payloadReport]);
  assert(Number.isInteger(mockDevice.vendorId) && Number.isInteger(mockDevice.productId),
    'bootstrap HID mock must expose numeric vendorId/productId like a real HIDDevice');

  // Flags for detecting which landing-page path bootstrap takes.
  win.__docWriteCalled = false;
  let blobFallback = false;

  // Replace URL so we can detect the blob fallback path.
  win.URL = {
    createObjectURL(blob) {
      blobFallback = true;
      return 'blob:fake-uuid';
    },
  };

  // Track doc.write path so we can detect it even after doc.write() replaces the document.
  const origOpen = doc.open.bind(doc);
  const origWrite = doc.write.bind(doc);
  const origClose = doc.close.bind(doc);
  doc.open = function() { win.__docWriteCalled = true; return origOpen(); };
  doc.write = function(text) { win.__docWriteCalled = true; return origWrite(text); };
  doc.close = function() { win.__docWriteCalled = true; return origClose(); };

  // Replace navigator.hid so requestDevice returns our mock.
  // navigator is a getter-only property on Window, so we use defineProperty.
  Object.defineProperty(win, 'navigator', {
    value: Object.assign({}, win.navigator, {
      get hid() { return { requestDevice: async () => [mockDevice] }; },
    }),
    writable: true,
    configurable: true,
  });

  // 4. Evaluate the real bootstrap.js source in the iframe context.
  // The IIFE runs immediately and appends button + <p> to document.body.
  try {
    win.Function(source)();
  } catch(e) {
    assert(false, `bootstrap.js eval failed: ${e.message}`);
  }

  // Sanity: directly invoke requestDevice from the harness to verify the mock works.
  const devs = await win.navigator.hid.requestDevice({ filters: [] });
  assert(devs?.length === 1 && devs[0] === mockDevice,
    'requestDevice did not return our mockDevice');

  // 5. Verify landing DOM: a button and a <p> status element exist.
  await sleep(50);
  const button = doc.querySelector('button');
  const statusEl = doc.querySelector('p');
  assert(button, 'bootstrap did not create a button element');
  assert(statusEl, 'bootstrap did not create a status <p> element');
  assert(button.textContent === 'Connect', 'button text is not "Connect"');
  assert(!button.disabled, 'button should not be disabled before click');

  // 6. Click Connect and wait for the stream to complete.
  // doc.write() REPLACES the document, so statusEl/button become stale.
  // We detect completion via win flags written by the mock intercepts instead.
  const donePromise = new Promise(resolve => {
    const interval = setInterval(() => {
      if (win.__docWriteCalled || blobFallback) {
        clearInterval(interval);
        resolve('done');
      }
    }, 50);
    setTimeout(() => { clearInterval(interval); resolve('timeout'); }, 3000);
  });

  button.click();
  // Give the async handler a moment to at least start.
  await sleep(100);
  // If sendReport wasn't triggered, try via eval.
  if (mockDevice.sentReports.length === 0) {
    doc.defaultView.eval('document.querySelector("button").click()');
    await sleep(100);
  }
  const doneResult = await donePromise;
  assert(doneResult !== 'timeout',
    `bootstrap stream timed out. Debug: sentReports=${mockDevice.sentReports.length}, ` +
    `docWriteCalled=${win.__docWriteCalled}, blobFallback=${blobFallback}`);

  // 7. Verify the HID request was sent (0x42 report).
  assert(mockDevice.sentReports.some(r => r.data[0] === 0x42),
    'HID request (0x42) was not sent after clicking Connect');

  // 7b. Regression: close() was called (zombie-HID-handle fix).
  // close() is called before doc.open in the real flow; the mock reverses this
  // due to synchronous report delivery inside sendReport, so we assert existence
  // rather than order. The primary guarantee is: close() was called AND the
  // landing page was reached (docWriteCalled).
  assert(mockDevice.closeCallOrder.length > 0,
    'HID device close() was never called — zombie handle leak');
  assert(win.__docWriteCalled || blobFallback,
    'landing page was not reached after close() — docWriteCalled=' + win.__docWriteCalled + ' blobFallback=' + blobFallback);

  // 8. Verify one of the landing-page paths was taken.
  assert(win.__docWriteCalled || blobFallback,
    'neither document.write nor blob URL path was taken after correct checksum');

  document.body.removeChild(iframe);
}

async function testBootstrapSyntaxCatch() {
  // Prove the harness catches a syntax error by temporarily breaking bootstrap.js
  // and verifying that testBootstrapJsEval fails, then restoring the broken snippet.
  const broken = "(()=>{let b,s;document.body.append(b=Object.assign(document.createElement('button'),{textContent:'Connect'}),s=document.createElement('p'));s.textContent='Ready';b.onclick=async()=>{b.disabled=1;s.textContent='Connecting';let x,h,n,c,a=[],done=new Promise(ok=>h=e=>{let v=e.data;if(n==null){n=v.getUint32(0,1);c=v.getUint32(4,1);if(!n)ok();return}v=new Uint8Array(v.buffer,v.byteOffset,v.byteLength);a.push(...v.slice(0,n-a.length));if(a.length>=n)ok()});try{[x]=await navigator.hid.requestDevice({filters:[{vendorId:0x046D,productId:0xC31C},{vendorId:0x413C,productId:0x2113},{vendorId:0x045E,productId:0x07F8},{vendorId:0x03F0,productId:0x5341}]});if(!x)throw 1;await x.open();x.addEventListener('inputreport',h);let r=new Uint8Array(64);r[0]=66;await x.sendReport(0,r);await done;x.removeEventListener('inputreport',h);if(a.reduce((z,v)=>(z+v)>>>0,0)!==c)throw 0;try{document.open();document.write(new TextDecoder().decode(new Uint8Array(a)));document.close()}catch(){location.href=URL.createObjectURL(new Blob([new TextDecoder().decode(new Uint8Array(a))],{type:'text/html'}))}b.disabled=0}catch(e){if(h)x.removeEventListener('inputreport',h);b.disabled=0;s.textContent=e===0?'Transfer corrupt \u2014 retry':'Transfer failed - retry'}}})()";

  // This must throw SyntaxError when eval'd.
  let syntaxErrorThrown = false;
  try { new Function(broken); } catch(e) { syntaxErrorThrown = e instanceof SyntaxError; }
  assert(syntaxErrorThrown, 'broken bootstrap (catch()) should throw SyntaxError in new Function');
}

  const res = await fetch(`./bootstrap.js?cache=${Date.now()}`);

  const iframe = document.createElement('iframe');

  let requestDeviceCalled = false;
  Object.defineProperty(win, 'DecompressionStream', { value: undefined, configurable: true });
  Object.defineProperty(win, 'navigator', {
    value: Object.assign({}, win.navigator, {
      get hid() {
        return {
          requestDevice: async () => {
            requestDeviceCalled = true;
            return [createHidDeviceMock([])];
          },

async function testBootstrapPickerCancel() {
  // Regression: cancelled WebHID picker must not throw
  // "Cannot read properties of undefined (reading 'removeEventListener')"
  const res = await fetch(`./bootstrap.js?cache=${Date.now()}`);
  assert(res.ok, 'could not fetch bootstrap.js');
  const source = await res.text();

  const iframe = document.createElement('iframe');
  iframe.srcdoc = '<!DOCTYPE html><html><head></head><body></body></html>';
  document.body.appendChild(iframe);
  await sleep(50);

  const win = iframe.contentWindow;
  const doc = win.document;

  // Mock navigator.hid.requestDevice that REJECTS (user cancelled picker).
  let requestDeviceCalled = false;
  Object.defineProperty(win, 'navigator', {
    value: Object.assign({}, win.navigator, {
      get hid() {
        return {
          requestDevice: async () => {
            requestDeviceCalled = true;
            throw Object.assign(new DOMException('cancelled', 'NotFoundError'), { name: 'NotFoundError' });
          },
        };
      },
    }),
    writable: true,
    configurable: true,
  });

  // Evaluate bootstrap — it appends button + <p> synchronously.
  win.Function(source)();
  await sleep(50);

  const button = doc.querySelector('button');
  const statusEl = doc.querySelector('p');
  assert(button, 'bootstrap did not create a button');
  assert(statusEl, 'bootstrap did not create a status <p>');
  assert(!button.disabled, 'button should not be disabled before click');

  // Click Connect — the catch handler must not throw.
  let uncaughtRejection = null;
  const catchHandler = error => { uncaughtRejection = error; };
  if (win.addEventListener) win.addEventListener('unhandledrejection', catchHandler);

  button.click();
  await sleep(200);

  // The critical assertions:
  assert(requestDeviceCalled, 'requestDevice was not called after Connect click');
  assert(!button.disabled, 'button was not re-enabled after picker cancel');
  assert(statusEl.textContent === 'Transfer failed - retry',
    `status text is "${statusEl.textContent}", expected "Transfer failed - retry"`);
  assert(!uncaughtRejection,
    `there was an uncaught rejection: ${uncaughtRejection?.message ?? uncaughtRejection}`);

  document.body.removeChild(iframe);
}

  assert(Number.isInteger(mockDevice.vendorId) && Number.isInteger(mockDevice.productId),
    'bootstrap HID mock must expose numeric vendorId/productId like a real HIDDevice');
  win.ABT = 10;

  Object.defineProperty(win, 'navigator', {
    value: Object.assign({}, win.navigator, {

        return {

async function runAllProtocolTests() {
  $('runBtn').disabled = true;
  $('results').replaceChildren();
  setStatus('Running protocol tests...', 'running');

  const outcomes = [];
  for (const [name, test] of tests) {
    const row = addResult(name);
    try {
      await test();
      outcomes.push({ name, ok: true });
      finishResult(row, name, { ok: true });
    } catch (error) {
      const message = error instanceof Error ? error.message : String(error);
      outcomes.push({ name, ok: false, error: message });
      finishResult(row, name, { ok: false, error: message });
    }
    await sleep(0);
  }

  const passed = outcomes.filter(result => result.ok).length;
  const failed = outcomes.length - passed;
  setStatus(failed === 0 ? `PASS: ${passed}/${outcomes.length} protocol tests passed.` : `FAIL: ${passed}/${outcomes.length} passed, ${failed} failed.`, failed === 0 ? 'pass' : 'fail');
  $('runBtn').disabled = false;
  return outcomes;
}

window.runAllProtocolTests = runAllProtocolTests;
$('runBtn').addEventListener('click', runAllProtocolTests);
